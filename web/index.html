<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tox Chat (Go)</title>
    <link rel="stylesheet" href="/web/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="self-info" id="selfInfo">
                <div class="self-header">
                    <div class="self-avatar" id="selfAvatar">?</div>
                    <div class="self-info-content">
                        <div class="self-name-row">
                            <div class="self-name" id="selfName">未设置名称</div>
                            <div class="self-status-badge" id="statusBadge">加载中...</div>
                        </div>
                        <div class="self-status-message" id="selfStatusMessage">无状态消息</div>
                    </div>
                </div>
                <div class="self-address-row">
                    <span class="self-address" id="selfAddress" title="点击复制完整地址">...</span>
                    <button class="copy-btn" id="copyBtn" onclick="copyAddress()">复制</button>
                </div>
                <div class="self-actions">
                    <button class="action-btn" onclick="showEditSelf()">编辑信息</button>
                    <button class="action-btn" onclick="bootstrap()">连接网络</button>
                    <button class="action-btn" onclick="showQRCode()">二维码</button>
                </div>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="showTab('all')">全部</button>
                <button class="tab" onclick="showTab('friends')">好友</button>
                <button class="tab" onclick="showTab('groups')">群组</button>
                <button class="tab" onclick="showTab('conferences')">会议</button>
            </div>
            <div class="list" id="contactList"></div>
            <div class="sidebar-bottom">
                <div class="add-friend-bottom">
                    <input type="text" id="addFriendInputBottom" placeholder="好友公钥">
                    <button onclick="addFriendFromBottom()">添加</button>
                </div>
                <div class="join-group-bottom">
                    <input type="text" id="joinGroupInputBottom" placeholder="群组ID">
                    <button onclick="joinGroupFromBottom()">加入</button>
                </div>
                <div class="create-buttons-row">
                    <button class="create-btn" onclick="createConference()">🎥 会议</button>
                    <button class="create-btn" onclick="createGroup()">👥 群组</button>
                </div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <span id="chatHeaderText">选择聊天对象</span>
                <select class="lang-selector" id="langSelector" onchange="switchLanguage(this.value)">
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="en-US">English</option>
                </select>
            </div>
            <div class="messages" id="messageArea"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息...">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 编辑自己信息模态框 -->
    <div class="modal hidden" id="editSelfModal">
        <div class="modal-content">
            <h3>编辑个人信息</h3>
            <div class="form-group">
                <label>名称:</label>
                <input type="text" id="editName" placeholder="输入名称">
            </div>
            <div class="form-group">
                <label>状态消息:</label>
                <input type="text" id="editStatus" placeholder="输入状态消息">
            </div>
            <div class="modal-actions">
                <button onclick="saveSelfInfo()">保存</button>
                <button onclick="hideEditSelf()">取消</button>
            </div>
        </div>
    </div>

    <!-- Friend context menu -->
    <div id="friendMenu" class="context-menu hidden">
        <div class="menu-item" data-action="info">查看信息</div>
        <div class="menu-item" data-action="invite_conference">邀请进会议</div>
        <div class="menu-item" data-action="invite_group">邀请进群组</div>
        <div class="menu-item danger" data-action="delete">删除好友</div>
    </div>

    <!-- Conference context menu -->
    <div id="conferenceMenu" class="context-menu hidden">
        <div class="menu-item" data-action="info">查看信息</div>
        <div class="menu-item danger" data-action="leave">离开会议</div>
    </div>

    <!-- Group context menu -->
    <div id="groupMenu" class="context-menu hidden">
        <div class="menu-item" data-action="info">查看信息</div>
        <div class="menu-item danger" data-action="leave">离开群组</div>
    </div>
    
    <!-- Friend info modal -->
    <div id="friendInfoModal" class="modal hidden">
        <div class="modal-content">
            <h3>好友信息</h3>
            <div class="info-row"><label>名称:</label><span id="infoFriendName"></span></div>
            <div class="info-row"><label>好友ID:</label><span id="infoFriendId"></span></div>
            <div class="info-row"><label>状态:</label><span id="infoFriendStatus"></span></div>
            <div class="info-row"><label>连接:</label><span id="infoFriendConn"></span></div>
            <div class="info-row"><label>公钥:</label><span id="infoFriendPk" class="mono"></span></div>
            <div class="modal-actions">
                <button onclick="hideFriendInfo()">关闭</button>
            </div>
        </div>
    </div>

    <!-- Conference info modal -->
    <div id="conferenceInfoModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="conferenceInfoTitle">会议信息</h3>
            <div class="info-row"><label>会议ID:</label><span id="infoConferenceId"></span></div>
            <div class="info-row"><label>类型:</label><span id="infoConferenceType"></span></div>
            <div class="modal-actions">
                <button onclick="hideConferenceInfo()">关闭</button>
            </div>
        </div>
    </div>

    <!-- Group info modal -->
    <div id="groupInfoModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="groupInfoTitle">群组信息</h3>
            <div class="info-row"><label>群组ID:</label><span id="infoGroupId"></span></div>
            <div class="modal-actions">
                <button onclick="hideGroupInfo()">关闭</button>
            </div>
        </div>
    </div>

    <!-- Select conference dialog (for invite) -->
    <div id="selectConferenceModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="selectConferenceTitle">选择会议</h3>
            <select id="conferenceSelect" style="width: 100%; margin: 10px 0;"></select>
            <div class="modal-actions">
                <button onclick="confirmConferenceInvite()">邀请</button>
                <button onclick="hideSelectConference()">取消</button>
            </div>
        </div>
    </div>

    <!-- Group creation modal -->
    <div id="groupModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="groupModalTitle">创建群组</h3>
            <div class="modal-body">
                <div class="form-inline">
                    <label for="groupNameInput" id="labelGroupName">群组名称：</label>
                    <input type="text" id="groupNameInput" placeholder="输入群组名称">
                </div>
                <div class="form-inline">
                    <label for="groupCreatorNameInput" id="labelCreatorName">创建者昵称：</label>
                    <input type="text" id="groupCreatorNameInput" placeholder="输入你的昵称">
                </div>
                <div class="form-inline">
                    <label for="groupPasswordInput" id="labelGroupPassword">密码（可选）：</label>
                    <input type="password" id="groupPasswordInput" placeholder="留空则不设密码">
                </div>
                <div class="form-inline">
                    <label for="groupPrivacySelect" id="labelPrivacy">隐私状态：</label>
                    <select id="groupPrivacySelect">
                        <option value="public">公开</option>
                        <option value="private">私密</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button onclick="confirmCreateGroup()" id="btnConfirmGroup">确认</button>
                <button onclick="closeGroupModal()" id="btnCancelGroup">取消</button>
            </div>
        </div>
    </div>
    
    <script src="/web/app.js"></script>
</body>
</html>
