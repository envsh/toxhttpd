---
name: CI

on:
  push:
    branches: [main, master, tryci]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install backend dependencies
        run: |
          sudo apt update
          sudo apt install -y libtoxcore-dev libopus-dev \
            libsodium-dev libcurl4-openssl-dev
      - name: Pre-build custom commands
        run: ./scripts/ci_prebuild_go.sh
      - name: Build backend
        run: cd go-toxhttpd && ls -lh || true
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: bin/
          retention-days: 30

  build-backend-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install toxcore dependencies
        run: |
          brew install toxcore opus libsodium openal-soft
      - name: Build backend
        run: |
          git clone -b group-ngc https://github.com/envsh/go-toxcore-c.git go-toxhttpd/go-toxcore-c
          cd go-toxhttpd && ln -sv go.work.impl go.work
          CGO_ENABLED=1 go build -o toxhttpd .
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: bin/
          retention-days: 30

  # Note: Ubuntu 18.04 is NOT supported as a container for GitHub Actions
  # because the runner's Node.js 20 requires GLIBC 2.28+, but Ubuntu 18.04
  # only has GLIBC 2.27.
  # Error: /__e/node20/bin/node: /lib/x86_64-linux-gnu/libc.so.6:
  # version `GLIBC_2.28' not found

  build-qltox-qt3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config \
            libcurl4-openssl-dev libfreetype-dev libopenal-dev \
            libx11-dev libxext-dev uuid-dev
      - name: Download and extract precompiled Qt3
        run: |
          sudo ln -sv /opt /opu
          curl -sL "https://github.com/qtchina/qt_build_scripts/releases/download/qt4.8/tde-qt338sh-linux-cjkinput-x64.tar.gz" \
            | sudo tar xzf - -C /opt
      - name: Install vcpkg and hjson-cpp
        run: |
          sudo mkdir -p /opt/vcpkg
          sudo chown "$(whoami)" /opt/vcpkg
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          /opt/vcpkg/vcpkg install hjson-cpp --triplet x64-linux-dynamic
      - name: Build qltox with Qt3
        run: |
          export PATH=/opt/qt338sh/bin:$PATH
          export QMAKESPEC=linux-g++
          cd qltox
          /opt/qt338sh/bin/qmake -makefile
          make -j$(nproc)
      - name: Prepare frontend artifact
        run: |
          mkdir -p bin
          cp qltox/qltox bin/qltox
          chmod +x bin/qltox
      - name: Upload qltox binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qltox-qt3-frontend
          path: bin/
          retention-days: 30

  build-qltox-qt5-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt5
        run: |
          brew install qt@5 freetype openal-soft pkg-config
          echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
      - name: Verify Qt5 installation
        run: |
          qmake -v
          which qmake
      - name: Install vcpkg and hjson-cpp
        run: |
          sudo mkdir -p /opt/vcpkg
          sudo chown "$(whoami)" /opt/vcpkg
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          /opt/vcpkg/vcpkg install hjson-cpp --triplet x64-osx-dynamic
      - name: Build qltox with Qt5
        run: |
          cd qltox
          export PKG_CONFIG_PATH=/usr/local/opt/openal-soft/lib/pkgconfig
          qmake qltox.pro CONFIG-=app_bundle
          make -j$(sysctl -n hw.logicalcpu)
      - name: Prepare artifact
        run: |
          mkdir -p bin
          cp qltox/qltox bin/qltox
          chmod +x bin/qltox
      - name: Upload qltox binary
        uses: actions/upload-artifact@v4
        with:
          name: qltox-qt5-macos-frontend
          path: bin/
          retention-days: 30

  package-release-linux:
    runs-on: ubuntu-22.04
    needs: [build-backend, build-qltox-qt3]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: qltox-qt3-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/qltox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-linux-x86_64-${{ github.ref_name }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: toxhttpd-linux-x86_64-*.tar.gz
          retention-days: 90

  package-release-macos:
    runs-on: ubuntu-22.04
    needs: [build-backend-mac, build-qltox-qt5-mac]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: qltox-qt5-macos-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/qltox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-macos-x86_64-${{ github.ref_name }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: toxhttpd-macos-x86_64-*.tar.gz
          retention-days: 90

  upload-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [package-release-linux, package-release-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: release/
      - name: Download macOS native release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: release/native/
      - name: Prepare files for upload
        run: |
          find release/ -name '*.tar.gz' -exec mv {} . \;
          ls -lh *.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            toxhttpd-*.tar.gz
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            toxhttpd-*.tar.gz --clobber
