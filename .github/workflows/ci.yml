---
name: CI

on:
  push:
    branches: [main, master, tryci]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install backend dependencies
        run: |
          sudo apt update
          sudo apt install -y libtoxcore-dev libopus-dev \
            libsodium-dev libcurl4-openssl-dev
      - name: Pre-build custom commands
        run: ./scripts/ci_prebuild_go.sh
      - name: Build backend
        run: cd go-toxhttpd && ls -lh || true
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: bin/
          retention-days: 30

  build-backend-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install toxcore dependencies
        run: |
          brew install toxcore opus libsodium
      - name: Build backend
        run: |
          git clone -b group-ngc https://github.com/envsh/go-toxcore-c.git go-toxhttpd/go-toxcore-c
          cd go-toxhttpd && ln -sv go.work.impl go.work
          CGO_ENABLED=1 go build -o toxhttpd .
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: bin/
          retention-days: 30

  # Note: Ubuntu 18.04 is NOT supported as a container for GitHub Actions
  # because the runner's Node.js 20 requires GLIBC 2.28+, but Ubuntu 18.04
  # only has GLIBC 2.27.
  # Error: /__e/node20/bin/node: /lib/x86_64-linux-gnu/libc.so.6:
  # version `GLIBC_2.28' not found

  build-qltox-qt4:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt4 from PPA
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common \
            wget \
            gnupg \
            build-essential \
            pkg-config \
            xvfb

          # 添加 rock-core/qt4 PPA
          add-apt-repository ppa:rock-core/qt4 -y

          apt-get update

          # 安装Qt4及依赖
          apt-get install -y --no-install-recommends \
            qt4-default \
            libqt4-dev \
            qt4-qmake \
            qt4-dev-tools \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libcjson-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

          rm -rf /var/lib/apt/lists/*
      - name: Verify Qt4 installation
        run: |
          qmake -v
          dpkg -l | grep -E "qt4|libqt" | head -10
      - name: Verify build tools and libcurl
        run: |
          make -v
          gcc --version | head -1
          g++ --version | head -1
          pkg-config --modversion libcurl || true
          dpkg -l | grep -E "libcurl|build-essential"
      - name: Build q3tox with Qt4
        run: |
          cd q3tox
          qmake q3tox.pro
          make -j$(nproc)
      - name: Prepare frontend artifact
        run: |
          mkdir -p bin
          cp q3tox/q3tox bin/q3tox
          chmod +x bin/q3tox
      - name: Upload q3tox binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: q3tox-qt4-frontend
          path: bin/
          retention-days: 30

  build-qltox-qt5-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt5
        run: |
          brew install qt@5 freetype pkg-config
          echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
      - name: Verify Qt5 installation
        run: |
          qmake -v
          which qmake
      - name: Build q3tox with Qt5
        run: |
          cd q3tox
          qmake q3tox.pro CONFIG-=app_bundle
          make -j$(sysctl -n hw.logicalcpu)
      - name: Prepare artifact
        run: |
          mkdir -p bin
          cp q3tox/q3tox bin/q3tox
          chmod +x bin/q3tox
      - name: Upload q3tox binary
        uses: actions/upload-artifact@v4
        with:
          name: q3tox-qt5-macos-frontend
          path: bin/
          retention-days: 30

  package-release-linux:
    runs-on: ubuntu-22.04
    needs: [build-backend, build-qltox-qt4]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: q3tox-qt4-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/q3tox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-linux-x86_64-${{ github.sha }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: toxhttpd-linux-x86_64-*.tar.gz
          retention-days: 90

  package-release-macos:
    runs-on: ubuntu-22.04
    needs: [build-backend-mac, build-qltox-qt5-mac]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: q3tox-qt5-macos-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/q3tox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-macos-x86_64-${{ github.sha }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: toxhttpd-macos-x86_64-*.tar.gz
          retention-days: 90

  upload-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [package-release-linux, package-release-macos]
    permissions:
      contents: write
    steps:
      - name: Download Linux release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: release/
      - name: Download macOS native release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: release/native/
      - name: Prepare files for upload
        run: |
          find release/ -name '*.tar.gz' -exec mv {} . \;
          ls -lh *.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            toxhttpd-*.tar.gz 2>/dev/null || true
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            toxhttpd-*.tar.gz --clobber
